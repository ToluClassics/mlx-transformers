[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mlx-transformers"
version = "0.3.0"
description = "Hugging Face-style transformer inference implemented in MLX for Apple silicon."
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
  { name = "Ogundepo Odunayo", email = "ogundepoodunayo@gmail.com" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: MacOS X",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: MacOS :: MacOS X",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "huggingface-hub>=0.22.2",
  "mlx>=0.31.0,<0.33",
  "numpy>=1.26.4,<3",
  "safetensors>=0.4.3",
  "transformers>=4.57.6,<6",
]

[project.scripts]
mlx-transformers-benchmark = "mlx_transformers.benchmark:main"
mlx-transformers-generate = "mlx_transformers.cli:main"

[project.optional-dependencies]
tokenizers = [
  "sentencepiece>=0.2.0",
  "tokenizers>=0.19.1",
]
vision = [
  "pillow>=10.3.0",
  "torch>=2.2.2",
]
examples = [
  "datasets>=2.19.0",
  "pillow>=10.3.0",
  "sentencepiece>=0.2.0",
  "tokenizers>=0.19.1",
  "torch>=2.2.2",
  "tqdm>=4.66.2",
]
chat = [
  "sentencepiece>=0.2.0",
  "streamlit>=1.34.0",
  "tokenizers>=0.19.1",
]
test = [
  "build>=1.2",
  "pre-commit>=4",
  "ruff==0.3.0",
  "twine>=5",
]

[project.urls]
Homepage = "https://github.com/ToluClassics/mlx-transformers"
Repository = "https://github.com/ToluClassics/mlx-transformers"
Issues = "https://github.com/ToluClassics/mlx-transformers/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["mlx_transformers*"]

[tool.setuptools.package-data]
mlx_transformers = ["benchmark_data/*.json"]
