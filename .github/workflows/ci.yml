name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint and build
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install quality tools
        run: python -m pip install "ruff==0.3.0" build twine
      - name: Lint
        run: ruff check .
      - name: Check formatting
        run: ruff format --check .
      - name: Build distributions
        run: python -m build
      - name: Check distribution metadata
        run: python -m twine check dist/*
      - name: Verify wheel version
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          python -c "import mlx_transformers; assert mlx_transformers.__version__ == '0.3.0'"
      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-package
          path: dist/
          if-no-files-found: error
          retention-days: 90

  offline-tests:
    name: Offline tests (${{ matrix.name }})
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: minimum
            python: "3.10"
            mlx: "0.31.0"
            transformers: "4.57.6"
          - name: current
            python: "3.13"
            mlx: "0.32.0"
            transformers: "5.14.1"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "mlx==${{ matrix.mlx }}" \
            "transformers==${{ matrix.transformers }}"
          python -m pip install --no-deps -e .
      - name: Import installed package
        run: python -c "import mlx_transformers.models"
      - name: Run bounded offline suite
        env:
          HF_HUB_OFFLINE: "1"
          TOKENIZERS_PARALLELISM: "false"
          TRANSFORMERS_OFFLINE: "1"
        run: python -m unittest discover -s tests -v
